<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g transform="rotate(-25, 16, 16)">
    <!-- Foam bubbles (rounded) -->
    <ellipse cx="9" cy="7" rx="2.5" ry="2" fill="#fffde0"/>
    <ellipse cx="14" cy="5.5" rx="3" ry="2.5" fill="#fffde0"/>
    <ellipse cx="19" cy="6.5" rx="2.5" ry="2" fill="#fffde0"/>
    <ellipse cx="22" cy="8" rx="2" ry="1.5" fill="#fffde0"/>
    <ellipse cx="7" cy="8.5" rx="1.5" ry="1.5" fill="#fffde0"/>
    <!-- Foam base -->
    <rect x="5" y="8" width="20" height="3" rx="1" fill="#fffde0"/>

    <!-- Mug body outline (rounded) -->
    <rect x="6" y="10" width="18" height="17" rx="3" fill="#2a1800"/>
    <!-- Beer fill -->
    <rect x="7" y="11" width="16" height="15" rx="2" fill="#e8860a"/>

    <!-- Chamfered stein divets — dark groove + light highlight pairs -->
    <!-- Groove 1 -->
    <rect x="10" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
    <rect x="11" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>
    <!-- Groove 2 -->
    <rect x="14" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
    <rect x="15" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>
    <!-- Groove 3 -->
    <rect x="18" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
    <rect x="19" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>

    <!-- General beer highlight (left edge) -->
    <rect x="8" y="12" width="2" height="13" rx="1" fill="#f8c060" opacity="0.4"/>

    <!-- Mug base -->
    <rect x="5" y="26" width="20" height="3" rx="2" fill="#2a1800"/>
    <rect x="6" y="27" width="18" height="2" rx="1" fill="#5a2e00"/>

    <!-- Handle top bar -->
    <rect x="25" y="12" width="5" height="2" rx="1" fill="#2a1800"/>
    <rect x="26" y="12.5" width="3.5" height="1" rx="0.5" fill="#c8824a"/>
    <!-- Handle outer wall -->
    <rect x="29" y="12" width="2" height="11" rx="1" fill="#2a1800"/>
    <rect x="29.5" y="13" width="1" height="9" rx="0.5" fill="#c8824a"/>
    <!-- Handle opening -->
    <rect x="26" y="14" width="3" height="7" rx="1" fill="#1a0800"/>
    <!-- Handle bottom bar -->
    <rect x="25" y="21" width="5" height="2" rx="1" fill="#2a1800"/>
    <rect x="26" y="21.5" width="3.5" height="1" rx="0.5" fill="#c8824a"/>
  </g>
</svg>
