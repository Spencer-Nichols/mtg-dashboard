<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#1c1917"/>

  <!-- Scale up the existing favicon design (32x32 → 512x512) -->
  <g transform="scale(16)">
    <g transform="rotate(-25, 16, 16)">

      <!-- Foam bubbles — distinct rounded circles with highlights -->
      <circle cx="7.5" cy="9" r="2" fill="#f0edd0"/>
      <circle cx="11" cy="7.8" r="2.8" fill="#fffde0"/>
      <circle cx="15.5" cy="6.8" r="3.2" fill="#ffffff"/>
      <circle cx="20" cy="7.5" r="2.8" fill="#fffde0"/>
      <circle cx="23.5" cy="9" r="1.8" fill="#f0edd0"/>
      <!-- Fill gaps at mug rim -->
      <rect x="5" y="9.5" width="20" height="2" fill="#fffde0"/>
      <!-- Bubble highlights (small glint top-left of each) -->
      <circle cx="6.8" cy="8.2" r="0.5" fill="#ffffff" opacity="0.7"/>
      <circle cx="10.2" cy="6.8" r="0.7" fill="#ffffff" opacity="0.7"/>
      <circle cx="14.5" cy="5.7" r="0.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="19.2" cy="6.5" r="0.7" fill="#ffffff" opacity="0.7"/>
      <circle cx="22.8" cy="8.2" r="0.5" fill="#ffffff" opacity="0.7"/>

      <!-- Mug body -->
      <rect x="6" y="10" width="18" height="17" rx="3" fill="#2a1800"/>
      <!-- Beer fill -->
      <rect x="7" y="11" width="16" height="15" rx="2" fill="#e8860a"/>

      <!-- Stein grooves -->
      <rect x="10" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
      <rect x="11" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>
      <rect x="14" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
      <rect x="15" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>
      <rect x="18" y="11" width="1" height="15" fill="#a05500" rx="0.5"/>
      <rect x="19" y="11" width="1" height="15" fill="#f8a830" rx="0.5"/>

      <!-- Beer highlight -->
      <rect x="8" y="12" width="2" height="13" rx="1" fill="#f8c060" opacity="0.4"/>

      <!-- Mug base -->
      <rect x="5" y="26" width="20" height="3" rx="2" fill="#2a1800"/>
      <rect x="6" y="27" width="18" height="2" rx="1" fill="#5a2e00"/>

      <!-- Handle -->
      <rect x="25" y="12" width="5" height="2" rx="1" fill="#2a1800"/>
      <rect x="26" y="12.5" width="3.5" height="1" rx="0.5" fill="#c8824a"/>
      <rect x="29" y="12" width="2" height="11" rx="1" fill="#2a1800"/>
      <rect x="29.5" y="13" width="1" height="9" rx="0.5" fill="#c8824a"/>
      <rect x="26" y="14" width="3" height="7" rx="1" fill="#1a0800"/>
      <rect x="25" y="21" width="5" height="2" rx="1" fill="#2a1800"/>
      <rect x="26" y="21.5" width="3.5" height="1" rx="0.5" fill="#c8824a"/>

      <!-- MTG card back oval — portrait orientation, purple border, brown fill -->
      <ellipse cx="15" cy="18.5" rx="4.2" ry="5.5" fill="#7a3520" stroke="#5b4aaa" stroke-width="0.38"/>
      <ellipse cx="15" cy="18.5" rx="3.5" ry="4.7" fill="none" stroke="#7b6acc" stroke-width="0.15"/>

      <!-- Five mana color dots -->
      <!-- White (top center) -->
      <circle cx="15" cy="15.2" r="0.42" fill="#f9f6e8"/>
      <!-- Green (middle left) -->
      <circle cx="13.4" cy="18.2" r="0.42" fill="#2d8a4e"/>
      <!-- Blue (middle right) -->
      <circle cx="16.6" cy="18.2" r="0.42" fill="#1a5fa0"/>
      <!-- Red (bottom left) -->
      <circle cx="13.8" cy="20.8" r="0.42" fill="#c41a1a"/>
      <!-- Black (bottom right) -->
      <circle cx="16.2" cy="20.8" r="0.42" fill="#1c1200" stroke="#6b5020" stroke-width="0.1"/>

    </g>
  </g>
</svg>
